<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>webpages</title>
<style>
  :root {
    --bg: #f2f4f7;
    --surface: #ffffff;
    --ink: #162031;
    --muted: #5a6476;
    --line: #d8dde6;
    --accent: #2b4c8c;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e131c;
      --surface: #161d29;
      --ink: #e5e9f0;
      --muted: #9ba5b6;
      --line: #283244;
      --accent: #8eaeed;
      color-scheme: dark;
    }
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 400 1rem/1.6 "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui,
      sans-serif;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  main { max-width: 40rem; margin: 0 auto; padding: 3rem 1rem; }
  h1 { margin: 0 0 1.5rem; font-size: 1.5rem; }
  ul { margin: 0; padding: 0; list-style: none; }
  li + li { margin-top: 0.75rem; }

  a {
    display: block;
    padding: 1rem 1.25rem;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--surface);
    color: var(--muted);
    text-decoration: none;
  }

  a strong { display: block; color: var(--accent); font-size: 1.125rem; }
  a:hover strong, a:focus-visible strong { text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>webpages</h1>
  <ul>
    <li>
      <a href="japan-flights/">
        <strong>가까운 해외 항공권</strong>
        인천·김포·청주에서 일본·대만·홍콩·마카오·베트남·방콕·괌·사이판으로 가는 직항과 1회 경유
        왕복 일정을 찾아, 연차가 적게 드는 일정과 확인된 운임을 함께 보여 줍니다.
      </a>
    </li>
  </ul>
</main>
</body>
</html>
