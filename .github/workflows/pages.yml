# Publishes this repository's pages to GitHub Pages: each page's site/ under the page's name, and
# index.html, which links to them, at the root. A repository has one Pages site and every
# deployment replaces all of it, so this one workflow builds every page. A push to any branch that
# touches a page runs every page's tests, builds the site and opens each page in a browser
# (smoke/); the default branch then publishes it. A daily run fetches the fares japan-flights
# shows and publishes again; a push keeps the fares the site has. Pages must be set to deploy from
# GitHub Actions; see README.md. fair-pick's API is a Cloudflare Worker that fair-pick-api.yml
# deploys; this workflow only tells the page where it is.
name: pages

on:
  push:
    # Branches only: a tag, such as a sparemine release's, builds nothing here.
    branches: ['**']
    paths:
      - index.html
      - japan-flights/**
      - skypass-cards/**
      - sparemine/**
      - fair-pick/**
      - smoke/**
      - .github/workflows/pages.yml
  schedule:
    # 01:30 in Korea. GitHub starts a scheduled run late when it is busy, often by hours.
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  japan-flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: japan-flights

  skypass-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: skypass-cards

  sparemine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: sparemine

  fair-pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: fair-pick

  build:
    needs: [japan-flights, skypass-cards, sparemine, fair-pick]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read # configure-pages reads the site's address
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
      - name: Build the site
        # Pages lets browsers keep a file for ten minutes, so a page fetched after a deploy could
        # run a script from before it. The script and style URLs carry the commit (?v=...) so a
        # deploy always loads its own; the grep fails the build if a file stops matching.
        # fair-pick calls the API at the repository variable FAIR_PICK_API, its Worker's https://
        # address; without it the page says its server is not connected.
        env:
          FAIR_PICK_API: ${{ vars.FAIR_PICK_API }}
        run: |
          mkdir _site
          cp index.html _site/
          cp -R japan-flights/site _site/japan-flights
          cp -R skypass-cards/site _site/skypass-cards
          cp -R sparemine/site _site/sparemine
          cp -R fair-pick/site _site/fair-pick
          v=${GITHUB_SHA::7}
          for page in japan-flights skypass-cards sparemine fair-pick; do
            sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" \
              _site/$page/index.html
            grep -q "style.css?v=$v" _site/$page/index.html
            grep -q "app.js?v=$v" _site/$page/index.html
          done
          sed -i "s|from './plan.js'|from './plan.js?v=$v'|" _site/japan-flights/app.js
          grep -q "plan.js?v=$v" _site/japan-flights/app.js
          sed -i "s|from './calc.js'|from './calc.js?v=$v'|" _site/skypass-cards/app.js
          grep -q "calc.js?v=$v" _site/skypass-cards/app.js
          sed -i "s|from './gen.js'|from './gen.js?v=$v'|" _site/sparemine/app.js
          grep -q "gen.js?v=$v" _site/sparemine/app.js
          sed -i -E "s#from '\./(api|calendar|config|rank|rules)\.js'#from './\1.js?v=$v'#" _site/fair-pick/app.js
          test "$(grep -c "\.js?v=$v'" _site/fair-pick/app.js)" -eq 5
          if [ -z "$FAIR_PICK_API" ]; then
            echo "::notice::FAIR_PICK_API is not set, so fair-pick says its server is not connected. See fair-pick/README.md."
          elif [[ "$FAIR_PICK_API" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$ ]]; then
            printf "export const API_BASE = '%s';\n" "${FAIR_PICK_API%/}" > _site/fair-pick/config.js
          else
            echo "::error::FAIR_PICK_API must be an https:// address, such as https://fair-pick.example.workers.dev"
            exit 1
          fi
      - name: Download the fares the site has now
        # The fetcher keeps them for the queries the API does not answer, all of them if it answers
        # none, and a push keeps them all. Nothing to download before the first deploy.
        continue-on-error: true
        run: >-
          curl -fsSL --retry 2 -o previous-fares.json
          "${{ steps.pages.outputs.base_url }}/japan-flights/data/live-fares.json"
      - name: Fetch live fares
        # The daily run and a run by hand fetch the fares, some 2,200 queries; a push, which changes
        # the pages and not the fares, keeps those downloaded above (--keep-previous) and fetches
        # only when there are none. Writes an empty file when the secret is not set. The page
        # publishes even if this fails.
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # The partner marker the page's Aviasales links carry; a variable, not a secret, since
          # every link shows it.
          TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
        run: |
          args=(--routes _site/japan-flights/data/routes.json --out _site/japan-flights/data/live-fares.json
            --previous previous-fares.json)
          if [ "$GITHUB_EVENT_NAME" = push ]; then args+=(--keep-previous); fi
          node japan-flights/tools/fetch-fares.js "${args[@]}"
      - name: Install a browser for the smoke test
        working-directory: smoke
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Open every page in the browser
        run: node smoke/smoke.js _site
      # Pages takes deployments from the default branch only. Scheduled runs always start there.
      - if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
