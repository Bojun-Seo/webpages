# Publishes this repository's pages to GitHub Pages: each page's site/ under the page's name, and
# index.html, which links to them, at the root. A repository has one Pages site and every
# deployment replaces all of it, so this one workflow builds every page. It tests a page on every
# push that touches it and publishes from the default branch; a daily run publishes again so the
# fares japan-flights fetches into the build stay fresh. Pages must be set to deploy from GitHub
# Actions; see README.md.
name: pages

on:
  push:
    paths:
      - index.html
      - japan-flights/**
      - skypass-cards/**
      - sparemine/**
      - .github/workflows/pages.yml
  schedule:
    - cron: '23 21 * * *' # 06:23 in Korea
  workflow_dispatch:

permissions:
  contents: read

jobs:
  japan-flights:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: japan-flights

  skypass-cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: skypass-cards

  sparemine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: sparemine

  deploy:
    needs: [japan-flights, skypass-cards, sparemine]
    # Pages takes deployments from the default branch only. Scheduled runs always start there.
    if: github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: Build the site
        # Pages lets browsers keep a file for ten minutes, so a page fetched after a deploy could
        # run a script from before it. The script and style URLs carry the commit (?v=...) so a
        # deploy always loads its own; the grep fails the build if a file stops matching.
        run: |
          mkdir _site
          cp index.html _site/
          cp -R japan-flights/site _site/japan-flights
          cp -R skypass-cards/site _site/skypass-cards
          cp -R sparemine/site _site/sparemine
          v=${GITHUB_SHA::7}
          for page in japan-flights skypass-cards sparemine; do
            sed -i "s|href=\"style.css\"|href=\"style.css?v=$v\"|; s|src=\"app.js\"|src=\"app.js?v=$v\"|" \
              _site/$page/index.html
            grep -q "style.css?v=$v" _site/$page/index.html
            grep -q "app.js?v=$v" _site/$page/index.html
          done
          sed -i "s|from './plan.js'|from './plan.js?v=$v'|" _site/japan-flights/app.js
          grep -q "plan.js?v=$v" _site/japan-flights/app.js
          sed -i "s|from './calc.js'|from './calc.js?v=$v'|" _site/skypass-cards/app.js
          grep -q "calc.js?v=$v" _site/skypass-cards/app.js
          sed -i "s|from './gen.js'|from './gen.js?v=$v'|" _site/sparemine/app.js
          grep -q "gen.js?v=$v" _site/sparemine/app.js
      - name: Download the fares the site has now
        # The fetcher keeps them for the queries the API does not answer, all of them if it answers
        # none. Nothing to download before the first deploy.
        continue-on-error: true
        run: >-
          curl -fsSL --retry 2 -o previous-fares.json
          "${{ steps.pages.outputs.base_url }}/japan-flights/data/live-fares.json"
      - name: Fetch live fares
        # Writes an empty file when the secret is not set. The page publishes even if this fails.
        continue-on-error: true
        env:
          TRAVELPAYOUTS_TOKEN: ${{ secrets.TRAVELPAYOUTS_TOKEN }}
          # The partner marker the page's Aviasales links carry; a variable, not a secret, since
          # every link shows it.
          TRAVELPAYOUTS_MARKER: ${{ vars.TRAVELPAYOUTS_MARKER }}
        run: >-
          node japan-flights/tools/fetch-fares.js
          --routes _site/japan-flights/data/routes.json
          --out _site/japan-flights/data/live-fares.json
          --previous previous-fares.json
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
