# Builds the sparemine CLI from the (private) applications repository and
# publishes the x86-64 binaries, with their SHA256SUMS, to a Release on THIS
# public repository, so the launcher page can link to them with no login (the
# README calls this option (a)). Push a tag like `sparemine-v0.1.0` to build
# and publish; a manual run (Actions -> sparemine binaries -> Run workflow)
# builds the same binaries as downloadable artifacts without creating a
# release.
#
# A Release goes up only when every build and the tests pass: the page links
# to the latest Release's files by name, so a Release without one of them
# would break the command the page gives for it. Every build takes the same
# commit of the source, which the Release names.
#
# Requires a repository secret APPLICATIONS_TOKEN: a token that can read
# bojun-seo/applications (a fine-grained PAT with Contents: Read on that repo).
# Without it the checkout of the private source fails. The source ref defaults
# to `master`; override it on a manual run until the miner is merged there.
name: sparemine binaries

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: applications ref to build from
        default: master
  push:
    tags:
      - 'sparemine-v*'

permissions:
  contents: read

env:
  SOURCE_REPO: bojun-seo/applications
  SOURCE_REF: ${{ github.event.inputs.source_ref || 'master' }}

jobs:
  # The commit of the source every build takes, so that a push to the source
  # while this runs cannot give the binaries of one Release different ones.
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - name: Check out the miner source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.APPLICATIONS_TOKEN }}
          # The token stays out of the checkout's git config, where the build could read it.
          persist-credentials: false
          path: src
      - id: sha
        run: echo "sha=$(git -C src rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-randomx
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: sparemine
            asset: sparemine-linux-x86_64-randomx
          - name: windows-randomx
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: sparemine.exe
            asset: sparemine-windows-x86_64-randomx.exe
    steps:
      - name: Check out the miner source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.APPLICATIONS_TOKEN }}
          persist-credentials: false
          path: src
      - name: Install Rust
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}
      - name: Test
        working-directory: src/sparemine
        run: cargo test -p miner-core --features randomx
      - name: Build CLI (release)
        working-directory: src/sparemine
        run: cargo build --release --target ${{ matrix.target }} -p miner-cli --features randomx
      - name: Stage asset
        shell: bash
        run: |
          mkdir -p dist
          cp "src/sparemine/target/${{ matrix.target }}/release/${{ matrix.bin }}" "dist/${{ matrix.asset }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # Fully static RandomX: musl libc + statically linked C++, built with zig as
  # the cross C/C++ compiler (the same idea that lets xmrig ship static Linux
  # binaries). This is the binary the launcher page recommends, so a Release
  # waits for it: if it breaks, nothing is published until it builds again.
  build-linux-randomx-static:
    name: linux-randomx-static
    needs: source
    runs-on: ubuntu-latest
    steps:
      - name: Check out the miner source
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.APPLICATIONS_TOKEN }}
          persist-credentials: false
          path: src
      - name: Install Rust + musl target
        run: |
          rustup update stable
          rustup target add x86_64-unknown-linux-musl
      - name: Install zig + cargo-zigbuild
        run: |
          python3 -m pip install --break-system-packages ziglang
          cargo install cargo-zigbuild --locked
      - name: Build (fully static)
        working-directory: src/sparemine
        run: cargo zigbuild --release --target x86_64-unknown-linux-musl -p miner-cli --features randomx
      - name: Stage + show linkage
        run: |
          mkdir -p dist
          cp src/sparemine/target/x86_64-unknown-linux-musl/release/sparemine dist/sparemine-linux-x86_64-randomx-static
          file dist/sparemine-linux-x86_64-randomx-static
          ldd dist/sparemine-linux-x86_64-randomx-static || echo "not a dynamic executable (static)"
      - uses: actions/upload-artifact@v7
        with:
          name: sparemine-linux-x86_64-randomx-static
          path: dist/sparemine-linux-x86_64-randomx-static
          if-no-files-found: error

  release:
    needs: [source, build, build-linux-randomx-static]
    # Only on a tag, and only when every job it needs passed.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the Release on this repository and upload assets
    steps:
      - name: Collect binaries
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Write the checksums
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the GitHub Release
        # With the gh CLI the runner has, so no other party's action holds this job's write access.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
        run: |
          {
            echo "sparemine CLI binaries (x86-64), built from ${SOURCE_REPO}@${SOURCE_SHA}."
            cat <<'EOF'
          The launcher page links to these:
          <https://bojun-seo.github.io/webpages/sparemine/>

          - `sparemine-linux-x86_64-randomx-static` — RandomX + SHA256d, fully
            static; runs on any x86-64 Linux. The page's default.
          - `sparemine-linux-x86_64-randomx` — RandomX + SHA256d; needs
            glibc >= 2.34 + libstdc++ (fallback).
          - `sparemine-windows-x86_64-randomx.exe` — RandomX + SHA256d.

          Check a download: `sha256sum -c SHA256SUMS --ignore-missing`
          Linux: `chmod +x <file> && ./<file> --print-devices`
          EOF
          } > notes.md
          tag=$GITHUB_REF_NAME
          if gh release view "$tag" > /dev/null 2>&1; then
            # A run again on the same tag puts this run's files and notes in place of the last.
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --notes-file notes.md
          else
            gh release create "$tag" dist/* --verify-tag --title "sparemine ${tag#sparemine-}" --notes-file notes.md
          fi
