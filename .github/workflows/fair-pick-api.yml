# Deploys the API the fair-pick page calls, a Cloudflare Worker with a Durable Object for each
# poll (fair-pick/api/), when a push to the default branch changes it, and on a run by hand
# (Actions → fair-pick api → Run workflow) from the default branch. A push to any other branch
# that changes it runs the tests and bundles the Worker without deploying it. The page itself is
# built and published by pages.yml, which takes the Worker's address from the repository variable
# FAIR_PICK_API.
#
# Deploying needs two repository secrets: CLOUDFLARE_API_TOKEN, a token made from Cloudflare's
# "Edit Cloudflare Workers" template, and CLOUDFLARE_ACCOUNT_ID. Until both are set the run says
# so and deploys nothing. A third, FAIR_PICK_RESEARCH_TOKEN, is the key that reads the records
# polls give to research; each deploy hands it to the Worker, and without it nobody can read them.
# fair-pick/README.md says how to set them up.
name: fair-pick api

on:
  push:
    branches: ['**']
    paths:
      - fair-pick/api/**
      - common/site/**
      - .github/workflows/fair-pick-api.yml
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a push's deploy is not cancelled by the next one.
concurrency:
  group: fair-pick-api-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Wrangler sends Cloudflare usage data unless told not to.
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test
        working-directory: common
      - run: npm test
        working-directory: fair-pick
      - run: npm ci
        working-directory: fair-pick/api
      - name: Bundle the Worker
        run: npx wrangler deploy --dry-run
        working-directory: fair-pick/api
      - name: Deploy the Worker
        if: github.ref_name == github.event.repository.default_branch
        working-directory: fair-pick/api
        # bash named outright runs with pipefail, so a failed deploy fails the step through tee.
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FAIR_PICK_RESEARCH_TOKEN: ${{ secrets.FAIR_PICK_RESEARCH_TOKEN }}
          FAIR_PICK_API: ${{ vars.FAIR_PICK_API }}
          FAIR_PICK_RESEARCH_API: ${{ vars.FAIR_PICK_RESEARCH_API }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are not both set, so the fair-pick API was not deployed. See fair-pick/README.md."
            exit 0
          fi
          npx wrangler deploy | tee deploy.log
          # The key that reads the records for research, kept as a secret of the Worker.
          if [ -n "$FAIR_PICK_RESEARCH_TOKEN" ]; then
            printf '%s' "$FAIR_PICK_RESEARCH_TOKEN" | npx wrangler secret put RESEARCH_TOKEN
          fi
          # The page finds the Worker at FAIR_PICK_API, or for records for research only at
          # FAIR_PICK_RESEARCH_API; say so if neither is where it went.
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -n 1 || true)
          if [ -n "$url" ] && [ "${FAIR_PICK_API%/}" != "$url" ] && [ "${FAIR_PICK_RESEARCH_API%/}" != "$url" ]; then
            echo "::notice::The fair-pick API is at $url. Set the repository variable FAIR_PICK_RESEARCH_API to it to keep the polls in links and send only records for research there, or FAIR_PICK_API to keep the polls there too (Settings → Secrets and variables → Actions → Variables), and run the pages workflow."
          fi
